name: build

# Manual only: run from the Actions tab or `gh workflow run build`.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Which platform to build (all, windows, macos or ubuntu)
        type: choice
        options: [all, windows, macos, ubuntu]
        default: all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # e.g. `gh workflow run build -f os=windows` builds only that platform.
        os: ${{ fromJSON(inputs.os == 'all' && '["windows-latest", "macos-latest", "ubuntu-latest"]' || format('["{0}-latest"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Ninja + MSVC on Windows too: works with whichever Visual Studio the image ships,
      # unlike the "Visual Studio 17 2022" generator.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ninja

      - name: Build
        run: cmake --build --preset ninja-debug

      - name: Test
        run: ctest --preset ninja-debug
