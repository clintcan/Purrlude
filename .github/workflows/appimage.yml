name: appimage

# Manual only: builds the Linux AppImage (`gh workflow run appimage`) and keeps it as a run
# artifact for 14 days. Attaching it to a release is a separate, deliberate step.
on:
  workflow_dispatch:

# Building only reads the repository.
permissions:
  contents: read

jobs:
  appimage:
    # The oldest Ubuntu it's built on is the oldest glibc it runs on.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      # Actions are pinned to commits (tags can be moved), with the release in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false   # nothing later needs the token

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .cpm-cache
          key: cpm-appimage-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ninja

      - name: Build
        run: cmake --build build --config Release --target Purrlude

      - name: Make the AppImage
        run: tools/packaging/make_appimage.sh build/Purrlude_artefacts/Release out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: Purrlude-AppImage
          path: out/*.AppImage
          retention-days: 14
          if-no-files-found: error
